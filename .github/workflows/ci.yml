name: eKYC CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source
        run: python -m compileall -q azure checks data_pipeline demo labeling modeling
      - name: Test monitoring
        run: python -m unittest demo.test_monitoring demo.test_operations
